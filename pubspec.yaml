name: canteen_lunch_attendance
description: RUH Canteen Lunch Attendance — NFC & list marking for school canteen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.2
  google_fonts: ^6.3.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_nfc_kit: ^3.5.2
  ndef: ^0.3.3
  audioplayers: ^6.1.0
  connectivity_plus: ^6.1.3
  pdf: ^3.11.3
  printing: ^5.14.3
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/splash_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A2B47"
  adaptive_icon_foreground: "assets/images/splash_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
